<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">The Church should be a refuge, not a source of trauma.</title>
  <desc id="desc">A dark poster with layered rainbow fabric-inspired folds and a message about church safety for LGBTQ+ people.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020204"/>
      <stop offset="0.52" stop-color="#09050d"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3157"/>
      <stop offset="0.55" stop-color="#9f153e"/>
      <stop offset="1" stop-color="#30030f"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8b1f"/>
      <stop offset="0.62" stop-color="#9f4615"/>
      <stop offset="1" stop-color="#321208"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd62f"/>
      <stop offset="0.65" stop-color="#a68a0c"/>
      <stop offset="1" stop-color="#3b3304"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ea95f"/>
      <stop offset="0.58" stop-color="#165b38"/>
      <stop offset="1" stop-color="#072417"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d72ff"/>
      <stop offset="0.55" stop-color="#173f91"/>
      <stop offset="1" stop-color="#071737"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a33bd2"/>
      <stop offset="0.6" stop-color="#5a1e73"/>
      <stop offset="1" stop-color="#210729"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.78"/>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="48%" r="72%">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#000" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.72"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="1600" fill="url(#bg)"/>

  <!-- Fabric-inspired folds -->
  <path d="M-90 310 C180 110 410 130 670 210 C870 270 1030 180 1290 300 L1280 650 C1030 580 830 600 590 540 C350 480 140 560 -80 520 Z" fill="url(#red)" opacity="0.88"/>
  <path d="M-100 430 C130 310 320 270 520 360 C690 438 840 390 1010 330 C1100 298 1200 320 1290 390 L1260 690 C1080 610 880 610 700 670 C470 745 230 660 -100 720 Z" fill="url(#orange)" opacity="0.78"/>
  <path d="M-80 510 C160 390 350 430 520 510 C720 605 960 500 1290 520 L1260 770 C990 730 770 820 540 760 C330 705 120 770 -100 820 Z" fill="url(#yellow)" opacity="0.82"/>
  <path d="M-100 620 C120 510 300 520 500 620 C690 715 910 680 1290 625 L1270 905 C1040 860 830 900 610 920 C370 940 180 845 -100 980 Z" fill="url(#green)" opacity="0.72"/>
  <path d="M-100 710 C120 610 320 640 490 760 C690 902 920 850 1290 770 L1260 1120 C960 1050 730 1110 510 1130 C310 1150 120 1050 -100 1190 Z" fill="url(#blue)" opacity="0.76"/>
  <path d="M-100 840 C130 720 320 770 520 910 C690 1030 940 980 1290 890 L1260 1320 C970 1240 730 1320 520 1340 C300 1360 120 1270 -100 1430 Z" fill="url(#purple)" opacity="0.68"/>

  <!-- Soft highlights and folds -->
  <ellipse cx="290" cy="470" rx="240" ry="82" fill="#ff536c" opacity="0.13" filter="url(#soft)"/>
  <ellipse cx="730" cy="630" rx="280" ry="100" fill="#ffb24a" opacity="0.11" filter="url(#soft)"/>
  <ellipse cx="360" cy="820" rx="250" ry="110" fill="#2d84ff" opacity="0.13" filter="url(#soft)"/>
  <ellipse cx="790" cy="1040" rx="280" ry="120" fill="#a945ce" opacity="0.12" filter="url(#soft)"/>

  <rect width="1200" height="1600" fill="url(#vignette)"/>
  <rect x="0" y="0" width="1200" height="1600" fill="#000" opacity="0.16"/>

  <!-- Main message -->
  <g filter="url(#shadow)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#fff">
    <text x="600" y="510" font-size="93" font-weight="800">The Church</text>
    <text x="600" y="620" font-size="93" font-weight="800">should be a</text>
    <text x="600" y="730" font-size="93" font-weight="800">refuge, not a</text>
    <text x="600" y="840" font-size="93" font-weight="800">source of</text>
    <text x="600" y="950" font-size="93" font-weight="800">trauma.</text>
  </g>

  <text x="600" y="1148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="69" font-weight="800" fill="#f4a51d" filter="url(#shadow)">Afterthechurch</text>
</svg>
