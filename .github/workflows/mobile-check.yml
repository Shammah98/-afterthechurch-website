name: Mobile app check

on:
  push:
    paths:
      - "afterthechurch-mobile/**"
      - "afterthechurch-professional-site/app/api/mobile/**"
      - ".github/workflows/mobile-check.yml"
  pull_request:
    paths:
      - "afterthechurch-mobile/**"
      - "afterthechurch-professional-site/app/api/mobile/**"
      - ".github/workflows/mobile-check.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: afterthechurch-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: afterthechurch-mobile/package.json
      - run: npm install
      - run: npm run typecheck
